name: grab
on:
  workflow_dispatch:
    inputs:
      url:
        description: link
        required: true
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U yt-dlp && sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
      - env:
          CK: ${{ secrets.IG_COOKIES }}
        run: |
          mkdir -p inbox
          if [ -n "$CK" ]; then printf '%s' "$CK" > c.txt; fi
          C=""; if [ -f c.txt ]; then C="--cookies c.txt"; fi
          yt-dlp $C -f "bv*+ba/b" --merge-output-format mp4 -o "inbox/%(id)s.%(ext)s" "${{ inputs.url }}"
          ls -t inbox/*.mp4 | head -1 | xargs -n1 basename > inbox/LATEST
          ls -lh inbox
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f inbox && git commit -m grab && git push
